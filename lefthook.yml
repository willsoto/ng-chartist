# https://lefthook.dev/configuration/
pre-commit:
  parallel: true
  jobs:
    - name: oxfmt
      glob: "*.{ts,js,md,json,html,yml,yaml}"
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
